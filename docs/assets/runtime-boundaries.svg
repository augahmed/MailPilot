<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">MailPilot runtime and trust boundaries</title><desc id="desc">React presents data through narrow Tauri commands. Rust owns lifecycle and private pipes. Go alone owns local storage, credentials, inference, Gmail and approved external AI.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18283d} .title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#51647b}.head{font-size:20px;font-weight:650}.body{font-size:16px}.label{font-size:15px;fill:#455d79}.line{fill:none;stroke:#557190;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#557190"/></marker></defs>
<rect width="1200" height="790" rx="20" fill="#f7f9fc"/>
<text x="32" y="48" class="title">Runtime and trust boundaries</text>
<text x="32" y="78" class="sub">One desktop product · one Go database owner per profile · no hosted backend</text>
<rect x="24" y="108" width="802" height="610" rx="20" fill="#edf3fb" stroke="#92afcf" stroke-dasharray="7 5"/>
<text x="44" y="139" class="label">USER DEVICE / PACKAGED APP</text>
<rect x="48" y="162" width="225" height="120" rx="14" fill="#ffffff" stroke="#c6d3e3" stroke-width="1.5"/>
<text x="66" y="194" class="head">React + TypeScript</text>
<text x="66" y="222" class="body">Presentation / validation</text>
<text x="66" y="246" class="body">Escaped mail and output</text>
<text x="66" y="270" class="body">No direct service access</text>
<rect x="315" y="162" width="206" height="120" rx="14" fill="#ffffff" stroke="#c6d3e3" stroke-width="1.5"/>
<text x="333" y="194" class="head">Rust / Tauri</text>
<text x="333" y="222" class="body">Desktop lifecycle</text>
<text x="333" y="246" class="body">Typed command allowlist</text>
<text x="333" y="270" class="body">Fixed Go executable</text>
<rect x="563" y="162" width="237" height="120" rx="14" fill="#ffffff" stroke="#c6d3e3" stroke-width="1.5"/>
<text x="581" y="194" class="head">Go application core</text>
<text x="581" y="222" class="body">Account + input checks</text>
<text x="581" y="246" class="body">Business rules / consent</text>
<text x="581" y="270" class="body">Bounded local jobs</text>
<path class="line" d="M273 220H315"/>
<path class="line" d="M521 220H563"/>
<text x="298" y="310" class="label">Typed IPC → private stdin/stdout pipes (strict framing and allowlists)</text>
<rect x="48" y="387" width="225" height="151" rx="14" fill="#ffffff" stroke="#c6d3e3" stroke-width="1.5"/>
<text x="66" y="419" class="head">SQLite</text>
<text x="66" y="447" class="body">Original cached email</text>
<text x="66" y="471" class="body">Shared chunks / FTS / vectors</text>
<text x="66" y="495" class="body">Categories / journals</text>
<text x="66" y="519" class="body">Sensitive, unencrypted</text>
<rect x="315" y="387" width="206" height="151" rx="14" fill="#ffffff" stroke="#c6d3e3" stroke-width="1.5"/>
<text x="333" y="419" class="head">OS credential store</text>
<text x="333" y="447" class="body">Refresh tokens + AI keys</text>
<text x="333" y="471" class="body">No plaintext fallback</text>
<text x="333" y="495" class="body">Access tokens in Go RAM</text>
<rect x="563" y="387" width="237" height="151" rx="14" fill="#ffffff" stroke="#c6d3e3" stroke-width="1.5"/>
<text x="581" y="419" class="head">Local CPU inference</text>
<text x="581" y="447" class="body">Pinned WordPiece + MiniLM</text>
<text x="581" y="471" class="body">Verified packaged resources</text>
<text x="581" y="495" class="body">Explicit Start / Resume</text>
<text x="581" y="519" class="body">No cloud embeddings</text>
<path class="line" d="M682 282V350H160V387"/>
<path class="line" d="M418 350V387"/>
<path class="line" d="M682 350V387"/>
<rect x="48" y="574" width="752" height="112" rx="14" fill="#ffffff" stroke="#c6d3e3" stroke-width="1.5"/>
<text x="66" y="606" class="head">Local authority stays in Go</text>
<text x="66" y="634" class="body">No generic fetch, shell, SQL or filesystem bridge to JavaScript.</text>
<text x="66" y="658" class="body">Demo profile: fictional account; no Gmail, keyring or external-AI adapters.</text>
<rect x="865" y="162" width="303" height="120" rx="14" fill="#fff8eb" stroke="#e2c78c" stroke-width="1.5"/>
<text x="883" y="194" class="head">Google / Gmail</text>
<text x="883" y="222" class="body">System-browser OAuth + PKCE</text>
<text x="883" y="246" class="body">Temporary loopback callback</text>
<text x="883" y="270" class="body">Sync / confirmed label changes</text>
<path class="line" d="M800 195H865"/>
<text x="808" y="183" class="label">HTTPS</text>
<rect x="865" y="365" width="303" height="173" rx="14" fill="#fff8eb" stroke="#e2c78c" stroke-width="1.5"/>
<text x="883" y="397" class="head">Optional OpenAI</text>
<text x="883" y="425" class="body">Go constructs bounded payload</text>
<text x="883" y="449" class="body">Exact preview + one-use approval</text>
<text x="883" y="473" class="body">Fixed Responses API / store:false</text>
<text x="883" y="497" class="body">No tools or Gmail credentials</text>
<text x="883" y="521" class="body">Provider retention / charges apply</text>
<path class="line" d="M800 250H840V418H865"/>
<text x="856" y="331" class="label">Separate approval gate</text>
<text x="865" y="589" class="head">Outside the device</text>
<text x="865" y="620" class="body">No external embeddings.</text>
<text x="865" y="646" class="body">No background external AI.</text>
<text x="865" y="672" class="body">No model action authority.</text>
<text x="32" y="756" class="sub">Scope: installed personal app. OAuth callback and development Vite server are narrowly scoped exceptions.</text>
</svg>
